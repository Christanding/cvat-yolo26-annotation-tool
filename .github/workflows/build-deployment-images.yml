name: Build deployment images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example 0.1.0
        required: true
        default: 0.1.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: Dockerfile
          - component: ui
            dockerfile: Dockerfile.ui
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/christanding/yolo26-annotator-${{ matrix.component }}:${{ inputs.version }}
            ghcr.io/christanding/yolo26-annotator-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Christanding/cvat-yolo26-annotation-tool
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
