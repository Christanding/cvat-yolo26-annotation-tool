x-local-server-image: &local-server-image local-annotator/server:${APP_VERSION:-dev}
x-local-ui-image: &local-ui-image local-annotator/ui:${APP_VERSION:-dev}

x-cvat-state-volumes: &cvat-state-volumes
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/data"
    target: /home/django/data
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/keys"
    target: /home/django/keys
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/logs"
    target: /home/django/logs

x-cvat-state-and-share-volumes: &cvat-state-and-share-volumes
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/data"
    target: /home/django/data
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/keys"
    target: /home/django/keys
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/logs"
    target: /home/django/logs
  - type: bind
    source: "${CVAT_WORKSPACE_ROOT:?set CVAT_WORKSPACE_ROOT}"
    target: /home/django/share
    read_only: true
    bind:
      create_host_path: false
  - type: tmpfs
    target: /home/django/share/.cvat-local

x-cvat-state-and-writable-share-volumes: &cvat-state-and-writable-share-volumes
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/data"
    target: /home/django/data
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/keys"
    target: /home/django/keys
  - type: bind
    source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/logs"
    target: /home/django/logs
  - type: bind
    source: "${CVAT_WORKSPACE_ROOT:?set CVAT_WORKSPACE_ROOT}"
    target: /home/django/share
    bind:
      create_host_path: false
  - type: tmpfs
    target: /home/django/share/.cvat-local

x-cvat-core-dependencies: &cvat-core-dependencies
  cvat_redis_inmem:
    condition: service_started
  cvat_redis_ondisk:
    condition: service_started
  cvat_db:
    condition: service_started

services:
  cvat_db:
    volumes:
      - type: bind
        source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/postgres"
        target: /var/lib/postgresql/data

  cvat_redis_inmem:
    volumes:
      - type: bind
        source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/redis"
        target: /data

  cvat_server:
    image: *local-server-image
    build:
      context: .
    depends_on: !override
      <<: *cvat-core-dependencies
      cvat_opa:
        condition: service_started
    environment:
      CVAT_ANALYTICS: '0'
      CVAT_LOCAL_WORKSPACE_ROOT: /home/django/share
      CVAT_NUCLIO_DEFAULT_TIMEOUT: '1'
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-and-share-volumes

  cvat_worker_utils:
    image: *local-server-image
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      CVAT_LOCAL_WORKSPACE_ROOT: /home/django/share
      DJANGO_LOG_SERVER_HOST: ''
    command: run worker notifications cleaning local_media
    volumes: *cvat-state-and-writable-share-volumes

  cvat_worker_import:
    image: *local-server-image
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-and-share-volumes

  cvat_worker_export:
    image: *local-server-image
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-and-share-volumes

  cvat_worker_annotation:
    image: *local-server-image
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-and-share-volumes

  cvat_worker_webhooks:
    image: *local-server-image
    profiles:
      - upstream-extra
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-volumes

  cvat_worker_quality_reports:
    image: *local-server-image
    profiles:
      - upstream-extra
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-volumes

  cvat_worker_chunks:
    image: *local-server-image
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-and-share-volumes

  cvat_worker_consensus:
    image: *local-server-image
    profiles:
      - upstream-extra
    depends_on: !override
      <<: *cvat-core-dependencies
    environment:
      DJANGO_LOG_SERVER_HOST: ''
    volumes: *cvat-state-volumes

  cvat_clickhouse:
    profiles:
      - upstream-analytics
    volumes:
      - type: bind
        source: "${CVAT_STATE_DIR:?set CVAT_STATE_DIR}/clickhouse"
        target: /var/lib/clickhouse

  cvat_vector:
    profiles:
      - upstream-analytics

  cvat_grafana:
    profiles:
      - upstream-analytics

  cvat_ui:
    image: *local-ui-image
    build:
      context: .
      dockerfile: Dockerfile.ui
